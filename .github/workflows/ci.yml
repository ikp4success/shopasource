name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: shopasource
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      API_KEY: testkey
      ENV_CONFIGURATION: debug
      SKIP_SENTRY: 1
      DB_USER: admin
      DB_PASS: admin
      DB_DOMAIN: localhost
      DB_PORT: 5432
      DB_NAME: shopasource
      SAVE_TO_DB: 0

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.x
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio flake8 flake8-bugbear
    - name: Lint
      run: flake8
    - name: Run tests
      run: pytest -q tests/
