(function() {
  var stored = null;
  try { stored = localStorage.getItem('theme'); } catch (e) {}
  var theme = stored || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

	<div id="shopsearch" class="Search" onclick="this.className='ResultSearch'">
		<h1 class="hero-title">Shop A Source</h1>
		<p class="hero-tagline">Search once, compare prices across dozens of stores instantly.</p>
		<div id="search_form" class="input-group">
  	<input id="searchbar" type="text" class="form-control input-large" aria-label="Search query" placeholder="e.g cheap waterproof hiking boots from target" style="width: 85%;" name="search">
  <div class="input-group-append">
    <select id="modelSelect" class="model-select" aria-label="Model to search with"></select>
    <button type="button" id="searchButton" class="btn btn-search" onclick="shop_web_search()">Search</button>
		<button type="button" id="cancelSearchButton" class="btn btn-danger" onclick="ini_reset_controls()" style="display: none;">Cancel</button>
  </div>
</div>
<div class="alert alert-danger alert-dismissible fade show" role="alert" style="display: none;">
	<strong>Invalid Search Criteria - </strong> textBox is empty or invalid.
</div>
		<div id="searchProgress" class="loading progress" style="display: none;">
  <div id="searchProgressBar" class="progress-bar progress-bar-striped bg-warning" role="progressbar"></div>
	</div>
<div class='container results_low'>
	<div id="priceFilter" class="price-filter" style="display: none;">
		<label for="minPrice">Price</label>
		<input type="number" id="minPrice" min="0" step="1" placeholder="Min" aria-label="Minimum price">
		<span class="price-filter-sep">&ndash;</span>
		<input type="number" id="maxPrice" min="0" step="1" placeholder="Max" aria-label="Maximum price">
		<button type="button" id="clearPriceFilter" class="price-filter-clear" style="display: none;">Clear</button>
	</div>
	<div id="resultreact">
	</div>
</div>
</div>


<div id="resultreact_default" style="display: none;">
	<div class="col-lg-3 col-md-4 col-sm-6 portfolio-item">
		<div class="card h-100">
				<span id="p_best" class="best-badge" style="display: none;">Best Price</span>
				<a id="p_link" target="_blank" href=""><img id="p_img_link" class="card-img-top" src="" alt=""/></a>
				<div class="card-body">
					<h4 class="card-title">
						<a id="p_link" target="_blank" href=""></a>
					</h4>
					<p id="p_description" class="card-text"></p>
					<p id="p_price" class="card-text"></p>
					<p id="p_shopname" class="card-text"></p>
				</div>
		</div>
	</div>
	</div>

</div>

<div id="spin_shop_default" style="display: none;">
	<div id="spin_shop" class="col-lg-3 col-md-4 col-sm-6 portfolio-item">

				<a href="#"><img class="card-img-top" src="" alt=""/></a>
				<div class="card-body">
					<h4 class="card-title">
						<a target="_blank" href="">Loading...</a>
					</h4>
					<div class="spinner-border text-warning sp_spinner" role="status">
						<span class="sr-only">Loading...</span>
					</div>
			</div>
		</div>
	</div>
</div>

<div id="load_next_default" style="display: none;">

				<h4 class="card-title">
				</h4>

</div>

<script>
document.getElementById("themeToggle").addEventListener("click", function() {
  var current = document.documentElement.getAttribute("data-theme");
  var next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (e) {}
});
</script>
