services:
- type: web
  name: shopasource
  runtime: docker
  plan: free
  healthCheckPath: /health
  envVars:
  - key: ENV_CONFIGURATION
    value: dev
  - key: DATABASE_URL
    fromDatabase:
      name: shopasource-db
      property: connectionString
  - key: API_KEY
    generateValue: true
  - key: SKIP_SENTRY
    value: '1'
  - key: SAVE_TO_DB
    value: '1'
  - key: SUPER_USER
    value: '0'
  - key: SET_LOG_LEVEL
    value: INFO
  # Free plan is 512MB total. Each concurrent shop is a full scrapy subprocess,
  # and each browser_fetch shop on top of that is a real headless Chromium
  # process - the defaults (4 / 1) already lean conservative, but this plan
  # needs tighter still. Raise these if/when this service moves off the free
  # plan.
  - key: MAX_CONCURRENT_SHOPS
    value: '2'
  - key: MAX_CONCURRENT_BROWSER_SHOPS
    value: '1'
  - key: DB_POOL_SIZE
    value: '3'
  - key: DB_MAX_OVERFLOW
    value: '2'
databases:
- name: shopasource-db
  plan: free
  databaseName: shopasource
